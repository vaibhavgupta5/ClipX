<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1480" viewBox="0 0 1440 1480" role="img" aria-labelledby="title desc" font-family="Inter, Arial, sans-serif">
<title id="title">ClipZ — AI video editing architecture</title><desc id="desc">Raw video is transcribed by ElevenLabs STT. A Director combines the transcript, enhanced user intent and editing skills into a deterministic tool call plan. A registry resolves tool names, and fuzzy matching finds manifest-backed assets. An executor produces edits that an LLM judge passes or undoes. YogaDB stores recall context and TigerDB stores execution timing logs. This diagram interprets a handwritten concept, rather than verifying an implementation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#245b87"/></marker></defs>
